name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check axor_probe/ tests/ --quiet

      - name: Type check
        run: mypy axor_probe/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish:
    name: Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          python - << 'EOF'
          import pathlib
          import re
          import sys
          import tomllib

          ref = "${{ github.ref_name }}"
          m = re.fullmatch(r"v(\d+\.\d+\.\d+)", ref)
          if not m:
              print(f"Tag {ref!r} must match vX.Y.Z")
              sys.exit(1)

          tag_version = m.group(1)
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          pkg_version = data["project"]["version"]

          if tag_version != pkg_version:
              print(f"Version mismatch: tag={tag_version}, pyproject={pkg_version}")
              sys.exit(1)

          # The version lives in two files and only pyproject was checked, so
          # axor_probe.__version__ could ship stale — every consumer reading it,
          # from a log line to a bug report, would name the wrong release. This
          # exact gap opened on the 0.2.1 bump: pyproject moved, __init__ did
          # not. axor-eval added the same check after the same near-miss.
          init = pathlib.Path("axor_probe/__init__.py").read_text(encoding="utf-8")
          found = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE)
          if not found:
              print("axor_probe/__init__.py declares no __version__")
              sys.exit(1)
          if found.group(1) != pkg_version:
              print(f"Version mismatch: __version__={found.group(1)}, "
                    f"pyproject={pkg_version}")
              sys.exit(1)

          print(f"Version check passed: {pkg_version}")
          EOF

      - name: Build
        run: |
          pip install hatchling build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
